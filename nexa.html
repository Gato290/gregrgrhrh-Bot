<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Premium – Webhook Sender</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    background:#0d1117;
    color:#e6edf3;
    font-family:Poppins,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:24px;
    width:100%;
    max-width:520px;
}
h1 { font-size:20px; margin-bottom:14px; }
input, select, button {
    width:100%;
    margin-bottom:12px;
    padding:10px;
    border-radius:8px;
    border:1px solid #30363d;
    background:#0b0f14;
    color:#e6edf3;
}
button {
    background:#2f81f7;
    border:none;
    font-weight:600;
    cursor:pointer;
}
button:hover { opacity:.9; }
small { color:#8b949e; }
</style>
</head>
<body>

<div class="card">
    <h1>Nexa Premium Purchase</h1>

    <input id="buyer" placeholder="Nama Pembeli">
    <input id="price" placeholder="Harga (Rp)">
    <input id="seller" placeholder="Nama Admin / Seller">

    <!-- IMAGE URL -->
    <input id="imageUrl" placeholder="📸 Screenshot Bukti Pembayaran (Image URL)">

    <!-- JUMLAH KEY -->
    <select id="keyCount">
        <option value="1">1 Key</option>
        <option value="2">2 Keys</option>
        <option value="3">3 Keys</option>
        <option value="4">4 Keys</option>
        <option value="5">5 Keys</option>
        <option value="6">6 Keys</option>
        <option value="7">7 Keys</option>
        <option value="8">8 Keys</option>
        <option value="9">9 Keys</option>
        <option value="10">10 Keys</option>
    </select>

    <!-- DURATION -->
    <select id="duration">
        <option value="30 Days">30 Days</option>
        <option value="40 Days">40 Days</option>
        <option value="50 Days">50 Days</option>
        <option value="60 Days">60 Days</option>
        <option value="70 Days">70 Days</option>
        <option value="Permanent">Permanent</option>
    </select>

    <select id="payment">
        <option>SociaBuzz</option>
        <option>DANA</option>
        <option>OVO</option>
        <option>Gopay</option>
    </select>

    <button onclick="sendWebhook()">Kirim ke Discord</button>
    <small>Screenshot akan muncul langsung di embed</small>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1419630439148032020/rR3AFZ7CljWE4bu1ocO4rwH3X-p5fBQ-HCXvnW1INb7KSuB0UhjgbnGbYt7P4lyLZq3L";

function sendWebhook() {
    const buyer = document.getElementById("buyer").value || "-";
    const price = document.getElementById("price").value || "-";
    const seller = document.getElementById("seller").value || "-";
    const keyCount = document.getElementById("keyCount").value;
    const duration = document.getElementById("duration").value;
    const payment = document.getElementById("payment").value;
    const imageUrl = document.getElementById("imageUrl").value;

    const embed = {
        title: "✨ Nexa Premium Purchase",
        description: "Thank you for your purchase",
        color: 7506394,
        fields: [
            {
                name: "👤 Buyer",
                value: buyer,
                inline: true
            },
            {
                name: "💰 Price",
                value: `\`\`\`lua\nRp ${price}\n\`\`\``,
                inline: true
            },
            {
                name: "🔑 Keys",
                value: `\`\`\`lua\n${keyCount} × Nexa Premium (${duration})\n\`\`\``
            },
            {
                name: "📦 Script",
                value: `\`\`\`lua\nNexa Premium — ${duration}\n\`\`\``
            },
            {
                name: "💳 Payment Method",
                value: `\`\`\`${payment}\`\`\``,
                inline: true
            },
            {
                name: "🔍 Item",
                value: `\`\`\`css\nSeller: ${seller}\nTanggal: ${new Date().toLocaleDateString()}\n\`\`\``
            }
        ],
        footer: {
            text: "Nexa Premium • Auto Webhook"
        },
        timestamp: new Date()
    };

    // Tambah image kalau ada URL
    if (imageUrl) {
        embed.image = { url: imageUrl };
    }

    fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
    })
    .then(() => alert("✅ Webhook berhasil dikirim"))
    .catch(() => alert("❌ Gagal kirim webhook"));
}
</script>

</body>
</html>
