<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Premium – Webhook Sender</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
    background:#0d1117;
    color:#e6edf3;
    font-family:Poppins, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:24px;
    width:100%;
    max-width:480px;
}
h1 { font-size:20px; margin-bottom:14px; }
input, select, button {
    width:100%;
    margin-bottom:12px;
    padding:10px;
    border-radius:8px;
    border:1px solid #30363d;
    background:#0b0f14;
    color:#e6edf3;
}
button {
    background:#2f81f7;
    border:none;
    font-weight:600;
    cursor:pointer;
}
button:hover { opacity:.9; }
small { color:#8b949e; }
</style>
</head>
<body>

<div class="card">
    <h1>Nexa Premium Purchase</h1>

    <input id="buyer" placeholder="Nama Pembeli">
    <input id="price" placeholder="Harga (Rp)">
    <input id="duration" placeholder="Durasi (XX Days / Permanent)">
    <input id="key" placeholder="Key / Jumlah">
    <input id="seller" placeholder="Nama Admin / Seller">

    <select id="payment">
        <option>SociaBuzz</option>
        <option>DANA</option>
        <option>OVO</option>
        <option>Gopay</option>
    </select>

    <button onclick="sendWebhook()">Kirim ke Discord</button>
    <small>Status akan muncul di console browser</small>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1419630439148032020/rR3AFZ7CljWE4bu1ocO4rwH3X-p5fBQ-HCXvnW1INb7KSuB0UhjgbnGbYt7P4lyLZq3L";

function sendWebhook() {
    const buyer = document.getElementById("buyer").value;
    const price = document.getElementById("price").value;
    const duration = document.getElementById("duration").value;
    const key = document.getElementById("key").value;
    const seller = document.getElementById("seller").value;
    const payment = document.getElementById("payment").value;

    const payload = {
        embeds: [
            {
                title: "✨ Nexa Premium Purchase",
                description: "Thank you for your purchase",
                color: 7506394,
                fields: [
                    {
                        name: "👤 Buyer",
                        value: buyer || "-",
                        inline: true
                    },
                    {
                        name: "💰 Price",
                        value: "```lua\nRp " + price + "\n```",
                        inline: true
                    },
                    {
                        name: "🔑 Keys",
                        value: "```lua\n" + key + " × Nexa Premium (" + duration + ")\n```"
                    },
                    {
                        name: "📦 Script",
                        value: "```lua\nNexa Premium — " + duration + "\n```"
                    },
                    {
                        name: "💳 Payment Method",
                        value: "```" + payment + "```",
                        inline: true
                    },
                    {
                        name: "🔍 Item",
                        value: "```css\nSeller: " + seller + "\nTanggal: " + new Date().toLocaleDateString() + "\n```"
                    }
                ],
                footer: {
                    text: "Nexa Premium • Auto Webhook"
                },
                timestamp: new Date()
            }
        ]
    };

    fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => alert("✅ Berhasil dikirim ke Discord"))
    .catch(err => {
        console.error(err);
        alert("❌ Gagal kirim webhook");
    });
}
</script>

</body>
</html>
