<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastefy Raw</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Pastefy Raw</h1>

    <textarea id="pasteInput" placeholder="Write or paste your code/text here..."></textarea>

    <div class="actions">
      <button id="saveBtn">Save Paste</button>
      <button id="copyBtn">Copy</button>
      <button id="clearBtn">Clear</button>
    </div>

    <h2>Saved Pastes</h2>
    <ul id="pasteList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
