<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Hub Update Sender v3.0</title>
<style>
:root {
  --bg-dark: #0d1117;
  --panel: #161b22;
  --text: #e6edf3;
  --accent: #ec4c4c;
  --secondary: #9ba3b4;
  --green: #238636;
  --blue: #58a6ff;
}
body {
  font-family: "Inter", "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #111726 0%, #0d1117 100%);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  text-align:center;
  padding:20px 0;
}
h1 {color:var(--accent); margin:0; font-weight:600;}
h2 {color:var(--secondary); font-weight:400; margin:4px 0 20px;}
.main {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
  padding:20px;
}
.form, .preview {
  background:rgba(22,27,34,0.95);
  border:1px solid #2f343f;
  border-radius:16px;
  padding:25px;
  flex:1;
  min-width:320px;
  max-width:600px;
  box-shadow:0 0 25px rgba(0,0,0,0.4);
}
label {display:block;margin-bottom:5px;color:var(--secondary);}
input,select,textarea {
  width:100%;background:var(--panel);color:var(--text);
  border:1px solid #30363d;border-radius:8px;padding:10px;font-size:15px;
  margin-bottom:15px;
}
button {
  width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;
  font-size:16px;font-weight:600;background:var(--green);color:white;
}
button:hover{background:#2ea043;}
button.secondary{background:var(--blue);}
button.secondary:hover{background:#79c0ff;}
.embed-box {
  background:#2f3136;border-left:4px solid var(--accent);
  border-radius:8px;padding:15px;
}
.embed-field {
  background:#36393f;border-radius:4px;padding:6px;margin-top:6px;
  white-space:pre-wrap;font-family:monospace;font-size:14px;
}
#status {text-align:center;margin-top:10px;}
.success{color:var(--green);} .error{color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>Nexa Hub</h1>
  <h2>Update Log Sender (Webhook System) v3.0</h2>
</header>

<div class="main">
  <!-- LEFT PANEL -->
  <div class="form">
    <label>🔗 Select Webhooks</label>
    <select id="webhookSelect" multiple>
      <option value="https://discord.com/api/webhooks/...">Update Nexa</option>
      <option value="https://discord.com/api/webhooks/...">Discord Test</option>
    </select>

    <label>🎮 Game</label>
    <select id="gameSelect">
      <option>Fish It</option><option>Plant Vs Brainrot</option>
    </select>

    <label>📦 Script Type</label>
    <select id="scriptSelect"><option>Free</option><option>Premium</option><option>Fixed</option></select>

    <label>✅ Version</label>
    <input type="text" id="versionInput" placeholder="v1.2.3">

    <label>📋 Update List</label>
    <textarea id="updateList" placeholder="## [+] Added:"></textarea>

    <label><input type="checkbox" id="mentionRole" checked> Mention @Update</label>
    <label><input type="checkbox" id="embedToggle" checked> Send as Embed</label>

    <button id="sendBtn">🚀 Send</button>
    <button id="copyJSONBtn" class="secondary" style="margin-top:8px;">📋 Copy JSON</button>
    <div id="status"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="preview">
    <h3 style="margin-top:0;color:var(--accent);">Embed Preview</h3>
    <div class="embed-box">
      <div><strong>🎮 Game:</strong> <span id="embedGame">Fish It (Free)</span></div>
      <div><strong>✅ Version:</strong> <span id="embedVersion">v1.0.0</span></div>
      <div><strong>📋 Updates:</strong></div>
      <div class="embed-field" id="embedUpdates">[No updates listed]</div>
    </div>
  </div>
</div>

<script>
const webhookSelect=document.getElementById("webhookSelect");
const gameSelect=document.getElementById("gameSelect");
const scriptSelect=document.getElementById("scriptSelect");
const versionInput=document.getElementById("versionInput");
const updateList=document.getElementById("updateList");
const mentionRole=document.getElementById("mentionRole");
const embedToggle=document.getElementById("embedToggle");
const sendBtn=document.getElementById("sendBtn");
const copyJSONBtn=document.getElementById("copyJSONBtn");
const embedGame=document.getElementById("embedGame");
const embedVersion=document.getElementById("embedVersion");
const embedUpdates=document.getElementById("embedUpdates");
const status=document.getElementById("status");

function updatePreview(){
  embedGame.textContent=`${gameSelect.value} (${scriptSelect.value})`;
  embedVersion.textContent=versionInput.value||"vX.X.X";
  embedUpdates.textContent=updateList.value||"[No updates listed]";
}
[gameSelect,scriptSelect,versionInput,updateList].forEach(e=>e.addEventListener("input",updatePreview));

function generatePayload(){
  const ping=mentionRole.checked?"<@&1390026095855796284>":"";
  const game=gameSelect.value;
  const script=scriptSelect.value;
  const version=versionInput.value.trim();
  const updates=updateList.value.trim();
  if(!embedToggle.checked){
    return {content:`${ping}\n**${game} (${script})**\n${version}\n${updates}`};
  }
  return {
    content:ping,
    username:"Nexa Hub〢Update Log",
    avatar_url:"https://i.imgur.com/B2NvjqW.png",
    embeds:[{
      title:"```Nexa Hub: Update Logs```",
      description:"🚀 New update available!",
      color:15527138,
      thumbnail:{url:"https://i.imgur.com/B2NvjqW.png"},
      fields:[
        {name:"`🎮 Game`",value:`\`\`\`${game} ${script}\`\`\``,inline:true},
        {name:"`✅ Version`",value:`\`\`\`${version}\`\`\``,inline:true},
        {name:"`📋 Updates`",value:`\`\`\`yml\n${updates}\n\`\`\``}
      ],
      footer:{text:"Nexa Hub Update | discord.gg/ECxQFc97F5"},
      timestamp:new Date().toISOString()
    }]
  };
}

copyJSONBtn.addEventListener("click",()=>{
  navigator.clipboard.writeText(JSON.stringify(generatePayload(),null,2));
  status.textContent="✅ JSON Copied!";
  status.className="success";
});

sendBtn.addEventListener("click",async()=>{
  const selected=Array.from(webhookSelect.selectedOptions).map(o=>o.value);
  if(selected.length===0)return(status.textContent="⚠️ Select webhook!",status.className="error");
  status.textContent="⏳ Sending...";
  let success=0,fail=0;
  for(const url of selected){
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(generatePayload())});
      if(res.ok)success++;else fail++;
    }catch{fail++;}
  }
  status.textContent=fail===0?`✅ Sent to ${success} webhook(s)!`:`⚠️ Sent ${success}, failed ${fail}.`;
  status.className=fail===0?"success":"error";
});
updatePreview();
</script>
</body>
</html>
