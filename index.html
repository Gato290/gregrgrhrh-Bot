<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Hub Update Logs</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .embed {
      background-color: #1c1f26;
      border-left: 5px solid #ec4c4c;
      padding: 20px;
      border-radius: 10px;
      width: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .embed h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #ff8080;
      text-align: center;
    }
    .field {
      margin-bottom: 15px;
    }
    .field-name {
      color: #9ba3b4;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .code {
      background-color: #0e1118;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      color: #d1d5db;
    }
    textarea, select {
      width: 100%;
      background-color: #0e1118;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 10px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      background-color: #238636;
      border: none;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
      margin-top: 15px;
    }
    button:hover {
      background-color: #2ea043;
    }
    footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="embed" id="preview">
    <h2>Nexa Hub: Update Logs</h2>

    <div class="field">
      <div class="field-name">🎮 Game</div>
      <select id="gameSelect">
        <option value="Fish It">Fish It</option>
        <option value="Plant vs Brainrot">Plant vs Brainrot</option>
      </select>
    </div>

    <div class="field">
      <div class="field-name">💎 Version</div>
      <select id="versionSelect">
        <option value="Free">Free</option>
        <option value="Premium">Premium</option>
      </select>
    </div>

    <div class="field">
      <div class="field-name">📋 Update List</div>
      <textarea id="updateList" rows="6" placeholder="Contoh:&#10;[+] Added Auto Quest&#10;[+] Fixed bugs"></textarea>
    </div>

    <button id="sendBtn">Send Update to Discord</button>

    <footer>Nexa Hub Update | discord.gg/ECxQFc97F5</footer>
  </div>

  <script>
    const webhookURL = "https://discord.com/api/webhooks/1389650936779112680/n0_vYgnRtCnmX8v0d2buMpnQrXn6SDZYELeNvdI50pRx7HiTR78JN-XVPdr0PuLzS6V1";

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const game = document.getElementById("gameSelect").value;
      const version = document.getElementById("versionSelect").value;
      const updateList = document.getElementById("updateList").value.trim();

      if (!updateList) {
        alert("Isi dulu update list-nya!");
        return;
      }

      if (webhookURL === "https://discord.com/api/webhooks/1389650936779112680/n0_vYgnRtCnmX8v0d2buMpnQrXn6SDZYELeNvdI50pRx7HiTR78JN-XVPdr0PuLzS6V1") {
        alert("Masukkan Webhook URL Discord dulu di kode!");
        return;
      }

      const payload = {
        content: "<@&1390026095855796284>",
        username: "Nexa Hub〢Update Log",
        embeds: [
          {
            title: "```Nexa Hub: Update Logs```",
            color: 15527138,
            fields: [
              {
                name: "`🎮 Games`",
                value: `\`\`\`${game} ${version}\`\`\``,
                inline: true
              },
              {
                name: "`✅ Version`",
                value: "```lua\n" + "v" + new Date().getFullYear().toString().slice(2) + "." + (new Date().getMonth()+1) + "." + new Date().getDate() + "\n```",
                inline: true
              },
              {
                name: "`📋 Update List`",
                value: "```yml\n" + updateList + "\n```"
              },
              {
                name: "Buy Key Premium https://discord.com/channels/1337779481477382174/1392861188152627331",
                value: "If u want get script, go to ⁠https://discord.com/channels/1337779481477382174/1389547349520416858\n\nIf u got bug , report on https://discord.com/channels/1337779481477382174/1405933599655723159"
              },
              {
                name: "`📦Script Free` PC Copy",
                value: "```lua\nloadstring(game:HttpGet(\"https://nexahubb.netlify.app/loader\"))()\n```"
              },
              {
                name: "Mobile Copy",
                value: "loadstring(game:HttpGet(\"https://nexahubb.netlify.app/loader\"))()"
              },
              {
                name: "**Note**",
                value: "Rejoin to see new update"
              }
            ],
            footer: {
              text: "Nexa Hub Update | discord.gg/ECxQFc97F5"
            }
          }
        ]
      };

      try {
        const res = await fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert(`✅ Update ${game} (${version}) berhasil dikirim ke Discord!`);
        } else {
          alert("❌ Gagal kirim update. Cek Webhook URL.");
        }
      } catch (e) {
        alert("❌ Error: " + e.message);
      }
    });
  </script>

</body>
</html>
