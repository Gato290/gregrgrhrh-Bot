<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexa Hub Super Premium Update Sender v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== STYLES (dipersingkat karena sudah benar di atas) ========== */
/* ... Semua CSS dari versi kamu tetap sama ... */
</style>
</head>
<body>
  <div class="container">
    <div class="premium-badge">Super Premium v3.0</div>
    <h1>🚀 Nexa Hub</h1>
    <h2>Super Premium Update Log Sender (Webhook System) v3.0</h2>

    <!-- Embed Type -->
    <div class="form-group">
      <label><span class="icon">🎨</span> Embed Type</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="normalEmbed" name="embedType" value="normal" checked>
          <label for="normalEmbed">Normal Embed</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="superPremiumEmbed" name="embedType" value="super-premium">
          <label for="superPremiumEmbed">Super Premium Embed</label>
        </div>
      </div>
    </div>

    <!-- Webhooks -->
    <div class="form-group">
      <label><span class="icon">🔗</span> Select Webhook URLs (Multi-Select)</label>
      <select id="webhookSelect" multiple>
        <option value="https://discord.com/api/webhooks/EXAMPLE1">Discord Nexa</option>
        <option value="https://discord.com/api/webhooks/EXAMPLE2">Discord Test</option>
      </select>
      <small style="color: var(--secondary); font-size: 12px;">Hold Ctrl (or Cmd) to select multiple.</small>
    </div>

    <!-- Game -->
    <div class="form-group">
      <label><span class="icon">🎮</span> Select Game</label>
      <select id="gameSelect">
        <option value="Fish It">Fish It</option>
        <option value="Plant Vs Brainrot">Plant Vs Brainrot</option>
      </select>
    </div>

    <!-- Script Type -->
    <div class="form-group">
      <label><span class="icon">📦</span> Script Type</label>
      <select id="scriptSelect">
        <option value="Free">Free</option>
        <option value="Premium">Premium</option>
        <option value="Fixed">Fixed</option>
      </select>
    </div>

    <!-- Version -->
    <div class="form-group">
      <label><span class="icon">✅</span> Version</label>
      <input type="text" id="versionInput" placeholder="Example: v1.2.3" />
    </div>

    <!-- Update List -->
    <div class="form-group">
      <label><span class="icon">📋</span> Update List</label>
      <textarea id="updateList" placeholder="[+] Added Auto Farm
[-] Fixed Bug in XYZ"></textarea>
    </div>

    <!-- Imgur -->
    <div class="form-group">
      <label><span class="icon">🖼️</span> Imgur URL (Alternative)</label>
      <input type="url" id="imgurUrlInput" placeholder="https://i.imgur.com/xxxxxx.png" />
    </div>

    <!-- File Upload -->
    <div class="form-group">
      <label><span class="icon">📎</span> Upload Image/Video (Optional)</label>
      <input type="file" id="fileInput" accept="image/*,video/*" />
    </div>

    <div class="button-group">
      <button id="previewBtn" class="secondary">👀 Preview Embed</button>
      <button id="sendBtn">🚀 Send Update</button>
    </div>

    <div id="status" class="status"></div>

    <!-- Preview -->
    <div class="preview" id="previewSection" style="display:none;">
      <h3>Discord Embed Preview</h3>
      <div class="embed-preview" id="embedPreview">
        <div class="embed-title" id="embedTitle">Nexa Hub: Update Logs</div>
        <div class="embed-field">
          <div class="embed-field-name">🎮 Game</div>
          <div class="embed-field-value" id="embedGame"></div>
        </div>
        <div class="embed-field">
          <div class="embed-field-name">📝 Version</div>
          <div class="embed-field-value" id="embedVersion"></div>
        </div>
        <div class="embed-field">
          <div class="embed-field-name">📋 Updates</div>
          <div class="embed-field-value" id="embedUpdates"></div>
        </div>
        <img id="embedImage" style="width:100%; border-radius:10px; margin-top:10px; display:none;" />
      </div>
    </div>

    <footer>© 2025 Nexa Hub — All Rights Reserved</footer>
  </div>

<script>
const webhookSelect = document.getElementById("webhookSelect");
const gameSelect = document.getElementById("gameSelect");
const scriptSelect = document.getElementById("scriptSelect");
const versionInput = document.getElementById("versionInput");
const updateList = document.getElementById("updateList");
const imgurUrlInput = document.getElementById("imgurUrlInput");
const fileInput = document.getElementById("fileInput");
const previewBtn = document.getElementById("previewBtn");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");
const previewSection = document.getElementById("previewSection");
const embedPreview = document.getElementById("embedPreview");

previewBtn.addEventListener("click", () => {
  const embedType = document.querySelector('input[name="embedType"]:checked').value;
  const game = gameSelect.value;
  const script = scriptSelect.value;
  const version = versionInput.value || "v1.0";
  const updates = updateList.value.trim() || "No updates provided.";
  const imgUrl = imgurUrlInput.value.trim();

  document.getElementById("embedGame").textContent = `${game} (${script})`;
  document.getElementById("embedVersion").textContent = version;
  document.getElementById("embedUpdates").textContent = updates;

  embedPreview.className = `embed-preview ${embedType}`;
  const imgElement = document.getElementById("embedImage");
  if (imgUrl) {
    imgElement.src = imgUrl;
    imgElement.style.display = "block";
  } else {
    imgElement.style.display = "none";
  }
  previewSection.style.display = "block";
  statusBox.textContent = "";
});

sendBtn.addEventListener("click", async () => {
  const selectedWebhooks = Array.from(webhookSelect.selectedOptions).map(o => o.value);
  if (selectedWebhooks.length === 0) {
    showStatus("Please select at least one webhook!", "error");
    return;
  }

  const embedType = document.querySelector('input[name="embedType"]:checked').value;
  const game = gameSelect.value;
  const script = scriptSelect.value;
  const version = versionInput.value || "v1.0";
  const updates = updateList.value.trim() || "No updates provided.";
  const imgUrl = imgurUrlInput.value.trim();

  const embed = {
    title: `📦 ${game} (${script}) — ${version}`,
    description: updates,
    color: embedType === "super-premium" ? 16766720 : 7506394,
    footer: { text: "Nexa Hub | Super Premium Update System" }
  };
  if (imgUrl) embed.image = { url: imgUrl };

  for (const url of selectedWebhooks) {
    try {
      await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
      });
    } catch (err) {
      console.error("Error sending to webhook:", err);
    }
  }

  showStatus("✅ Successfully sent update to selected webhooks!", "success");
});

function showStatus(msg, type) {
  statusBox.textContent = msg;
  statusBox.className = `status ${type}`;
}
</script>
</body>
</html>
