<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Hub Update Sender v3.0</title>
<style>
  :root {
    --bg-dark: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --accent: #ff4d4d;
    --secondary: #9ba3b4;
    --green: #2ea043;
    --blue: #58a6ff;
    --shadow: rgba(255, 77, 77, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Inter", "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #111726 0%, #0d1117 100%);
    color: var(--text);
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background-attachment: fixed;
  }

  .container {
    width: 100%;
    max-width: 750px;
    background: rgba(22, 27, 34, 0.96);
    border: 1px solid #2f343f;
    border-radius: 18px;
    padding: 30px 35px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  h1 {
    text-align: center;
    font-size: 32px;
    color: var(--accent);
    font-weight: 700;
    margin: 0;
    letter-spacing: 1px;
  }

  h2 {
    text-align: center;
    color: var(--secondary);
    margin-bottom: 25px;
    font-weight: 400;
    font-size: 15px;
  }

  .form-group { margin-bottom: 18px; }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: var(--secondary);
    font-size: 14px;
  }

  select, input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    color: var(--text);
    transition: 0.25s;
  }

  select:focus, input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 6px var(--shadow);
    outline: none;
  }

  select[multiple] { height: 110px; }
  textarea { height: 140px; resize: vertical; }

  .button-group {
    display: flex;
    gap: 12px;
    margin-top: 25px;
  }

  button {
    flex: 1;
    padding: 13px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: 0.25s;
  }

  button#previewBtn {
    background: var(--blue);
  }

  button#previewBtn:hover {
    background: #79c0ff;
    transform: translateY(-2px);
  }

  button#sendBtn {
    background: var(--green);
  }

  button#sendBtn:hover {
    background: #3fb950;
    transform: translateY(-2px);
  }

  #status {
    text-align: center;
    font-size: 14px;
    margin-top: 15px;
  }

  .success { color: var(--green); }
  .error { color: var(--accent); }

  .preview {
    margin-top: 35px;
    background: var(--panel);
    border: 1px solid #2f343f;
    border-radius: 12px;
    padding: 20px;
    animation: slideIn 0.5s ease;
  }

  @keyframes slideIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
  }

  .embed-preview {
    background: #1f2228;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 15px;
  }

  .embed-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .embed-field {
    margin: 8px 0;
  }

  .embed-field-name {
    font-weight: 600;
    color: var(--blue);
    margin-bottom: 4px;
  }

  .embed-field-value {
    background: #2d2f36;
    border-radius: 6px;
    padding: 8px;
    font-family: monospace;
    white-space: pre-wrap;
    font-size: 14px;
  }

  footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 25px;
  }

  footer a {
    color: var(--blue);
    text-decoration: none;
  }

  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <h1>🔥 Nexa Hub</h1>
    <h2>Update Log Sender (v3.0)</h2>

    <div class="form-group">
      <label>🔗 Select Webhooks</label>
      <select id="webhookSelect" multiple>
        <option value="https://discord.com/api/webhooks/1389650936779112680/n0_vYgnRtCnmX8v0d2buMpnQrXn6SDZYELeNvdI50pRx7HiTR78JN-XVPdr0PuLzS6V1">Discord Nexa</option>
        <option value="https://discord.com/api/webhooks/EXAMPLE_WEBHOOK_2">Discord ???</option>
      </select>
      <small style="color:var(--secondary);font-size:12px;">Hold Ctrl (or Cmd) to select multiple</small>
    </div>

    <div class="form-group">
      <label>🎮 Select Game</label>
      <select id="gameSelect">
        <option>Fish It</option>
        <option>Plant Vs Brainrot</option>
      </select>
    </div>

    <div class="form-group">
      <label>📦 Script Type</label>
      <select id="scriptSelect">
        <option>Free</option>
        <option>Premium</option>
        <option>Fixed</option>
      </select>
    </div>

    <div class="form-group">
      <label>✅ Version</label>
      <input type="text" id="versionInput" placeholder="Example: v2.5.0">
    </div>

    <div class="form-group">
      <label>📋 Update List</label>
      <textarea id="updateList" placeholder="[+] Added new auto feature..."></textarea>
    </div>

    <div class="form-group">
      <label>📎 Upload Image/Video (Optional)</label>
      <input type="file" id="fileInput" accept="image/*,video/*">
      <small style="color:var(--secondary);font-size:12px;">Max 8MB file limit.</small>
    </div>

    <div class="button-group">
      <button id="previewBtn">👀 Preview</button>
      <button id="sendBtn">🚀 Send Update</button>
    </div>

    <div id="status"></div>

    <div class="preview" id="previewSection" style="display:none;">
      <div class="embed-preview">
        <div class="embed-title" id="embedTitle">Nexa Hub: Update Logs</div>
        <div class="embed-field">
          <div class="embed-field-name">🎮 Game</div>
          <div class="embed-field-value" id="embedGame">Fish It (Free)</div>
        </div>
        <div class="embed-field">
          <div class="embed-field-name">✅ Version</div>
          <div class="embed-field-value" id="embedVersion">vX.X.X</div>
        </div>
        <div class="embed-field">
          <div class="embed-field-name">📋 Updates</div>
          <div class="embed-field-value" id="embedUpdates">[No updates]</div>
        </div>
      </div>
    </div>

    <footer>💻 Nexa Hub Update Sender v3.0 • <a href="https://discord.gg/ECxQFc97F5">discord.gg/ECxQFc97F5</a></footer>
  </div>

  <script>
    const webhookSelect = document.getElementById("webhookSelect");
    const gameSelect = document.getElementById("gameSelect");
    const scriptSelect = document.getElementById("scriptSelect");
    const versionInput = document.getElementById("versionInput");
    const updateList = document.getElementById("updateList");
    const fileInput = document.getElementById("fileInput");
    const previewBtn = document.getElementById("previewBtn");
    const sendBtn = document.getElementById("sendBtn");
    const previewSection = document.getElementById("previewSection");
    const embedGame = document.getElementById("embedGame");
    const embedVersion = document.getElementById("embedVersion");
    const embedUpdates = document.getElementById("embedUpdates");
    const status = document.getElementById("status");

    function updatePreview() {
      embedGame.textContent = `${gameSelect.value} (${scriptSelect.value})`;
      embedVersion.textContent = versionInput.value || "vX.X.X";
      embedUpdates.textContent = updateList.value || "[No updates]";
    }

    [gameSelect, scriptSelect, versionInput, updateList].forEach(el => {
      el.addEventListener("input", updatePreview);
    });

    previewBtn.onclick = () => {
      updatePreview();
      previewSection.style.display = "block";
      previewSection.scrollIntoView({ behavior: "smooth" });
    };

    sendBtn.onclick = async () => {
      const selectedWebhooks = Array.from(webhookSelect.selectedOptions).map(o => o.value);
      const version = versionInput.value.trim();
      const updates = updateList.value.trim();
      const game = gameSelect.value;
      const script = scriptSelect.value;
      const file = fileInput.files[0];

      if (!selectedWebhooks.length) return showStatus("⚠️ Select at least one webhook!", true);
      if (!version) return showStatus("⚠️ Please enter a version!", true);
      if (file && file.size > 8 * 1024 * 1024) return showStatus("⚠️ File too large (8MB max)!", true);

      const payload = {
        username: "Nexa Hub〢Update Log",
        avatar_url: "https://i.imgur.com/B2NvjqW.png",
        embeds: [{
          title: "🚀 Nexa Hub Update",
          color: 15527138,
          fields: [
            { name: "🎮 Game", value: `${game} (${script})`, inline: true },
            { name: "✅ Version", value: `\`${version}\``, inline: true },
            { name: "📋 Updates", value: "```yml\n" + updates + "\n```" },
            { name: "Loader", value: "```lua\nloadstring(game:HttpGet('https://nexahubb.netlify.app/loader'))()\n```" }
          ],
          footer: { text: "Nexa Hub Update • discord.gg/ECxQFc97F5" },
          timestamp: new Date().toISOString()
        }]
      };

      showStatus("⏳ Sending update...", false);
      let success = 0;

      for (const hook of selectedWebhooks) {
        try {
          let body, headers = {};
          if (file) {
            const fd = new FormData();
            fd.append("file", file);
            fd.append("payload_json", JSON.stringify(payload));
            body = fd;
          } else {
            headers["Content-Type"] = "application/json";
            body = JSON.stringify(payload);
          }
          const res = await fetch(hook, { method: "POST", headers, body });
          if (res.ok) success++;
        } catch {}
      }

      if (success === selectedWebhooks.length)
        showStatus(`✅ Successfully sent to ${success} webhook(s)!`, false, true);
      else
        showStatus(`⚠️ Some webhooks failed (${success}/${selectedWebhooks.length})`, true);
    };

    function showStatus(msg, error, success) {
      status.textContent = msg;
      status.className = error ? "error" : success ? "success" : "";
    }
  </script>
</body>
</html>
