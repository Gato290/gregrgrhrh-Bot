<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Hook — Webhook Sender</title>
<style>
:root {
  --bg-dark: #0d1117;
  --panel: #161b22;
  --text: #e6edf3;
  --accent: #5865f2;
  --gray: #30363d;
  --border: #21262d;
}

body {
  background-color: var(--bg-dark);
  color: var(--text);
  font-family: "Inter", sans-serif;
  display: flex;
  flex-direction: row;
  height: 100vh;
  margin: 0;
  overflow: hidden;
}

.left-panel {
  width: 55%;
  background-color: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px;
}

.right-panel {
  flex: 1;
  background-color: #0b0f14;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}

h2 {
  font-size: 18px;
  margin-bottom: 8px;
}

input, textarea {
  width: 100%;
  background-color: var(--gray);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 10px;
  font-size: 14px;
}

textarea {
  resize: vertical;
  min-height: 60px;
}

button {
  background-color: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover {
  background-color: #4752c4;
}

.section {
  margin-bottom: 16px;
}

.embed-container {
  background-color: var(--gray);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.embed-preview {
  background-color: #2f3136;
  border-radius: 8px;
  padding: 16px;
  max-width: 500px;
  font-family: "Whitney", sans-serif;
}

.embed-title {
  font-weight: bold;
  font-size: 16px;
  color: #fff;
}

.embed-desc {
  font-size: 14px;
  color: #dcddde;
  margin-top: 6px;
  white-space: pre-line;
}

.json-editor {
  background-color: #0d1117;
  border: 1px solid var(--border);
  color: #a9b1ba;
  padding: 10px;
  font-family: monospace;
  border-radius: 6px;
  min-height: 100px;
}
</style>
</head>
<body>

<div class="left-panel">
  <h2>Webhook URL</h2>
  <input id="webhookUrl" type="text" placeholder="https://discord.com/api/webhooks/...">

  <div class="section">
    <h2>Content</h2>
    <textarea id="content" maxlength="2000" placeholder="Optional message content..."></textarea>
  </div>

  <div class="section">
    <h2>Embed</h2>
    <div class="embed-container">
      <input id="embedTitle" placeholder="Embed Title">
      <textarea id="embedDescription" placeholder="Embed Description"></textarea>
      <input id="embedColor" placeholder="Embed Color (hex, e.g. #5865F2)">
      <button onclick="addEmbed()">Add Embed</button>
    </div>
  </div>

  <div class="section">
    <h2>JSON Editor</h2>
    <textarea id="jsonEditor" class="json-editor" placeholder="Paste JSON here if needed..."></textarea>
  </div>

  <button onclick="sendWebhook()">Send Webhook</button>
</div>

<div class="right-panel">
  <h2>Preview</h2>
  <div id="previewArea">
    <p style="opacity:0.6;">Nothing to preview yet...</p>
  </div>
</div>

<script>
let embeds = [];

function addEmbed() {
  const title = document.getElementById("embedTitle").value;
  const description = document.getElementById("embedDescription").value;
  const color = document.getElementById("embedColor").value || "#5865F2";

  const embed = {
    title: title,
    description: description,
    color: parseInt(color.replace("#", ""), 16)
  };
  embeds = [embed];
  updatePreview();
}

function updatePreview() {
  const preview = document.getElementById("previewArea");
  preview.innerHTML = "";

  const content = document.getElementById("content").value;
  if (content) {
    const msg = document.createElement("p");
    msg.textContent = content;
    msg.style.marginBottom = "10px";
    preview.appendChild(msg);
  }

  embeds.forEach(embed => {
    const embedBox = document.createElement("div");
    embedBox.className = "embed-preview";
    embedBox.style.borderLeft = `4px solid #${embed.color.toString(16)}`;

    const title = document.createElement("div");
    title.className = "embed-title";
    title.textContent = embed.title;

    const desc = document.createElement("div");
    desc.className = "embed-desc";
    desc.textContent = embed.description;

    embedBox.appendChild(title);
    embedBox.appendChild(desc);
    preview.appendChild(embedBox);
  });
}

function sendWebhook() {
  const url = document.getElementById("webhookUrl").value;
  const content = document.getElementById("content").value;

  if (!url) return alert("Webhook URL is required!");

  const data = {
    content: content || "",
    embeds: embeds
  };

  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => {
    if (res.ok) {
      alert("✅ Webhook sent!");
    } else {
      alert("❌ Failed to send webhook.");
    }
  })
  .catch(err => alert("Error: " + err));
}
</script>

</body>
</html>
