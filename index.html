<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexa Hub Update Sender v2.4</title>

<style>
:root {
  --bg-dark:#0d1117;
  --panel:#161b22;
  --text:#e6edf3;
  --accent:#ec4c4c;
  --secondary:#9ba3b4;
  --green:#238636;
  --blue:#58a6ff;
  --purple:#bc8cff;
}

body {
  font-family: "Inter","Segoe UI",sans-serif;
  background: radial-gradient(circle at top,#111726 0%,#0d1117 100%);
  color:var(--text);
  margin:0;
  padding:40px 20px;
}

/* ✅ LAYOUT SPLIT KIRI FORM – KANAN PREVIEW */
.wrapper {
  display:flex;
  gap:20px;
  max-width:1200px;
  margin:auto;
}

.container {
  background:rgba(22,27,34,0.95);
  border:1px solid #2f343f;
  border-radius:16px;
  backdrop-filter:blur(6px);
  padding:25px 30px;
  flex:1;
}

.preview-box {
  background:#0d1117;
  border:1px solid #30363d;
  border-radius:16px;
  padding:20px;
  width:420px;
}

h1{text-align:center;color:var(--accent)}
h2{text-align:center;color:var(--secondary);margin-bottom:20px}

label{color:var(--secondary)}
select,input,textarea{
  width:100%;
  background:var(--panel);
  color:var(--text);
  border-radius:8px;
  padding:12px;
  border:1px solid #30363d;
}

textarea{
  min-height:160px;
  font-size:16px;
  resize:none;
}

button{
  padding:13px;
  background:var(--green);
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  color:white;
}

button.secondary{background:var(--blue)}
.button-group{display:flex;gap:10px;margin-top:20px}

.status{text-align:center;margin-top:10px}
.success{color:#2ea043}
.error{color:var(--accent)}

.preview-embed{
  background:#161b22;
  border-radius:10px;
  padding:15px;
  font-size:14px;
}

.preview-embed img{
  width:100%;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- ================= FORM ================= -->
<div class="container">
<h1>Nexa Hub</h1>
<h2>Update Log Sender v2.2</h2>

<label>🔗 Select Webhook</label>
<select id="webhookSelect" multiple>
<option value="https://discord.com/api/webhooks/XXXX">Discord Nexa</option>
</select>

<br><br>

<label>🎮 Select Game</label>
<select id="gameSelect">
<option>Fish It</option>
<option>Plant Vs Brainrot</option>
</select>

<br><br>

<label>📦 Script Type</label>
<select id="scriptSelect" multiple>
<option>Free</option>
<option>Premium</option>
<option>Fixed</option>
</select>

<br><br>

<label>✅ Version</label>
<input id="versionInput" placeholder="v1.2.3">

<br><br>

<label>📋 Update List</label>
<textarea id="updateList"></textarea>

<br><br>

<label>📎 Upload Image / Video</label>
<input type="file" id="fileInput">

<div class="button-group">
<button class="secondary" id="previewBtn">👀 Preview</button>
<button id="sendBtn">🚀 Send</button>
</div>

<div id="status" class="status"></div>
</div>

<!-- ================= PREVIEW ================= -->
<div class="preview-box">
<h3 style="color:var(--purple)">Discord Embed Preview</h3>

<div class="preview-embed" id="previewEmbed">
<b>🎮 Game:</b><br>
<span id="pGame">-</span><br><br>

<b>📦 Script:</b><br>
<span id="pScript">-</span><br><br>

<b>✅ Version:</b><br>
<span id="pVersion">-</span><br><br>

<b>📋 Update:</b>
<pre id="pUpdate"></pre>

<!-- ✅ IMAGE PREVIEW -->
<img src="https://i.imgur.com/SnVNao1.gif">
</div>
</div>

</div>

<script>
const scriptSelect=document.getElementById("scriptSelect");
Array.from(scriptSelect.options).forEach(opt=>{
  opt.addEventListener("mousedown",e=>{
    e.preventDefault();
    opt.selected=!opt.selected;
  });
});

updateList.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=this.scrollHeight+"px";
});

/* PREVIEW */
previewBtn.onclick=()=>{
  pGame.textContent=gameSelect.value;
  pScript.textContent=[...scriptSelect.selectedOptions].map(o=>o.value).join(", ");
  pVersion.textContent=versionInput.value;
  pUpdate.textContent=updateList.value;
};

/* SEND */
sendBtn.onclick=async()=>{
const payload={
content:"<@&1390026095855796284>",
username:"Nexa Hub〢Update Log",
avatar_url:"https://i.imgur.com/0ncD3l8.jpeg",
embeds:[{
title:"```Nexa Hub: Update Logs```",
description:"🚀 New update available!",
color:15527138,
thumbnail:{url:"https://i.imgur.com/0ncD3l8.jpeg"},

/* ✅ IMAGE GIF EMBED */
image:{url:"https://i.imgur.com/SnVNao1.gif"},

fields:[
{name:"🎮 Game",value:gameSelect.value,inline:true},
{name:"📦 Script",value:[...scriptSelect.selectedOptions].map(o=>o.value).join(", "),inline:true},
{name:"✅ Version",value:versionInput.value},
{name:"📋 Update List",value:"```"+updateList.value+"```"}
],
timestamp:new Date().toISOString()
}]
};

await fetch(webhookSelect.value,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
});

status.textContent="✅ Sent!";
status.className="status success";
};
</script>

</body>
</html>
