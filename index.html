<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atomicals Update Sender v3.0</title>
<style>
  :root {
    --bg-dark: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --accent: #ec4c4c;
    --secondary: #9ba3b4;
    --green: #238636;
    --blue: #58a6ff;
  }
  body {
    font-family: "Inter", "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #111726 0%, #0d1117 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container {
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid #2f343f;
    border-radius: 16px;
    backdrop-filter: blur(6px);
    padding: 25px 30px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from {opacity:0;transform:translateY(10px);} to {opacity:1;transform:translateY(0);} }
  h1, h2 { text-align:center;margin:0 0 15px; }
  h1 { color:var(--accent);font-size:28px; }
  h2 { color:var(--secondary);font-size:16px;font-weight:normal;margin-bottom:25px; }
  label { display:block;margin-bottom:5px;color:var(--secondary);font-weight:500; }
  input,textarea,select {
    width:100%;background:var(--panel);color:var(--text);border:1px solid #30363d;
    border-radius:8px;padding:12px;font-size:15px;transition:0.2s;
  }
  input:focus,textarea:focus,select:focus {
    border-color:var(--accent);outline:none;box-shadow:0 0 5px rgba(236,76,76,0.5);
  }
  textarea { height:150px;resize:vertical;line-height:1.4; }
  .form-group { margin-bottom:20px; }
  button {
    width:100%;padding:13px;margin-top:10px;
    background:var(--green);color:white;font-size:16px;font-weight:600;
    border:none;border-radius:8px;cursor:pointer;transition:0.2s;
  }
  button:hover { background:#2ea043;transform:translateY(-2px); }
  button.secondary { background:var(--blue); }
  button.secondary:hover { background:#79c0ff; }
  .preview {
    margin-top:30px;background:var(--panel);border:1px solid #2f343f;
    border-radius:10px;padding:20px;animation:slideIn 0.5s ease;white-space:pre-wrap;
  }
  @keyframes slideIn { from {opacity:0;transform:translateY(20px);} to {opacity:1;transform:translateY(0);} }
  .status { margin-top:15px;text-align:center;font-size:14px; }
  .success { color:var(--green); }
  .error { color:var(--accent); }
</style>
</head>
<body>
  <div class="container">
    <h1>Atomicals Hub</h1>
    <h2>Update Log Sender v3.0 (Markdown Embed)</h2>

    <div class="form-group">
      <label for="webhookSelect">🔗 Discord Webhook</label>
      <select id="webhookSelect" multiple>
        <option value="https://discord.com/api/webhooks/1389650936779112680/n0_vYgnRtCnmX8v0d2buMpnQrXn6SDZYELeNvdI50pRx7HiTR78JN-XVPdr0PuLzS6V1">Atomicals Discord</option>
      </select>
    </div>

    <div class="form-group">
      <label for="gameInput">🎮 Game Name</label>
      <input type="text" id="gameInput" placeholder="Fish It!" />
    </div>

    <div class="form-group">
      <label for="versionInput">✅ Version</label>
      <input type="text" id="versionInput" placeholder="v0.2.0.0 Beta (Service Provider)" />
    </div>

    <div class="form-group">
      <label for="addedInput">🟢 Added</label>
      <textarea id="addedInput" placeholder="[ + ] Feature 1&#10;[ + ] Feature 2"></textarea>
    </div>

    <div class="form-group">
      <label for="improvedInput">🟡 Improved</label>
      <textarea id="improvedInput" placeholder="[ / ] Performance&#10;[ / ] UI Layout"></textarea>
    </div>

    <div class="form-group">
      <label for="deletedInput">🔴 Delete</label>
      <textarea id="deletedInput" placeholder="[-] Old Feature"></textarea>
    </div>

    <div class="form-group">
      <label for="imageLink">🖼️ Image / Thumbnail (Imgur URL)</label>
      <input type="url" id="imageLink" placeholder="https://i.imgur.com/example.png" />
    </div>

    <button id="previewBtn" class="secondary">👀 Preview Embed</button>
    <button id="sendBtn">🚀 Send to Discord</button>

    <div id="status" class="status"></div>

    <div class="preview" id="previewSection" style="display:none;"></div>
  </div>

  <script>
    const webhookSelect = document.getElementById("webhookSelect");
    const gameInput = document.getElementById("gameInput");
    const versionInput = document.getElementById("versionInput");
    const addedInput = document.getElementById("addedInput");
    const improvedInput = document.getElementById("improvedInput");
    const deletedInput = document.getElementById("deletedInput");
    const imageLink = document.getElementById("imageLink");
    const previewBtn = document.getElementById("previewBtn");
    const sendBtn = document.getElementById("sendBtn");
    const previewSection = document.getElementById("previewSection");
    const status = document.getElementById("status");

    function buildMarkdown() {
      const game = gameInput.value || "Unknown Game";
      const version = versionInput.value || "vX.X.X";
      const added = addedInput.value.trim() || "-";
      const improved = improvedInput.value.trim() || "-";
      const deleted = deletedInput.value.trim() || "-";
      const mention = "<@&1398313779380617459>";

      return `## Atomicals - Update Logs
- **${game}**
- **Version:** ${version}
- **Developer Notes:**
> Found any bugs or issues? Feel free to report them to the developers! 💙
> Got ideas or suggestions for new scripts? We’d love to hear them! 🚀
## Changelogs

### - Added:
${added}

### - Improved:
${improved}

### - Delete:
${deleted}
${mention}`;
    }

    function updatePreview() {
      const markdown = buildMarkdown();
      previewSection.textContent = markdown;
      previewSection.style.display = "block";
      previewSection.scrollIntoView({ behavior: "smooth" });
    }

    previewBtn.addEventListener("click", updatePreview);

    sendBtn.addEventListener("click", async () => {
      const webhooks = Array.from(webhookSelect.selectedOptions).map(o => o.value);
      if (webhooks.length === 0) {
        status.textContent = "⚠️ Please select at least one webhook!";
        status.className = "status error";
        return;
      }

      const img = imageLink.value || "https://i.imgur.com/B2NvjqW.png";
      const markdown = buildMarkdown();

      const payload = {
        username: "Atomicals〢Update Logs",
        avatar_url: "https://i.imgur.com/B2NvjqW.png",
        embeds: [{
          title: "Atomicals Update Logs",
          description: markdown,
          color: 15527138,
          thumbnail: { url: img },
          footer: { text: "Atomicals Hub | discord.gg/ECxQFc97F5" },
          timestamp: new Date().toISOString()
        }]
      };

      status.textContent = "⏳ Sending...";
      status.className = "status";

      let ok = 0, fail = 0;
      for (const url of webhooks) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res.ok) ok++; else fail++;
        } catch { fail++; }
      }

      if (fail === 0) { status.textContent = `✅ Sent to ${ok} webhook(s)!`; status.className = "status success"; }
      else { status.textContent = `⚠️ Sent ${ok}, failed ${fail}`; status.className = "status error"; }
    });
  </script>
</body>
</html>
