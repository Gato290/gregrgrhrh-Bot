<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lua → GameData Refactorer v1</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:18px;background:#0f1724;color:#e6eef8}
    header{display:flex;align-items:center;gap:12px}
    h1{font-size:18px;margin:0}
    .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    textarea{width:100%;height:60vh;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#071127;color:inherit;font-family:monospace}
    button{padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:white;cursor:pointer}
    .controls{display:flex;gap:8px;align-items:center}
    .small{font-size:13px;color:#bcd}
    footer{margin-top:10px;color:#9fb}
    label{display:flex;gap:6px;align-items:center}
    input[type=checkbox]{transform:scale(1.1)}
  </style>
</head>
<body>
  <header>
    <h1>Lua → GameData Refactorer</h1>
    <div class="small">Tempel script Roblox-mu lalu klik <strong>Refactor</strong></div>
  </header>

  <div class="wrap">
    <div>
      <div class="small">Input (copy-paste script di sini)</div>
      <textarea id="input" placeholder="Paste Lua script...">-- Contoh\nlocal LocalPlayer = game.Players.LocalPlayer\nlocal char = LocalPlayer.Character\nlocal hrp = char:WaitForChild('HumanoidRootPart')\nlocal TweenService = game:GetService('TweenService')\n</textarea>
    </div>

    <div>
      <div class="small">Output (hasil refactor)</div>
      <textarea id="output" readonly placeholder="Hasil akan muncul di sini"></textarea>
    </div>
  </div>

  <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
    <div class="controls">
      <button id="refactor">Refactor</button>
      <button id="copy">Copy hasil</button>
      <button id="download">Download .lua</button>
    </div>
    <label class="small"><input type="checkbox" id="replaceUses" checked /> Ganti penggunaan variabel (mis. `char` → `GameData.char`)</label>
    <label class="small"><input type="checkbox" id="includeTemplate" checked /> Sisipkan template GameData di atas</label>
  </div>

  <footer>
    Tip: tool ini dasar — cek kembali hasilnya. Kalau script kompleks (metatable, scopes, fungsi lokal dalam block) periksa manual.
  </footer>

  <script>
    const input = document.getElementById('input')
    const output = document.getElementById('output')
    const refactorBtn = document.getElementById('refactor')
    const copyBtn = document.getElementById('copy')
    const downloadBtn = document.getElementById('download')

    function detectService(expr){
      // deteksi kalau RHS memanggil game:GetService
      if(/game\s*:\s*GetService\s*\(/i.test(expr)) return true
      return false
    }

    function makeGameDataTemplate(vars){
      const lines = ["local GameData = {", "    -- Services & placeholders"]
      for(const v of vars){
        if(v.isService){
          lines.push(`    ${v.name} = game:GetService("${v.serviceName || v.serviceGuess || v.name}")`)
        } else {
          lines.push(`    ${v.name} = nil`)
        }
      }
      lines.push("}")
      return lines.join('\n') + '\n\n'
    }

    function refactorLua(source, opts={replaceUses:true, includeTemplate:true}){
      const lines = source.split(/\r?\n/)
      const locals = [] // {name, rhs, isService}
      const outLines = [...lines]

      // 1) cari deklarasi `local <name> = <expr>` (sederhana)
      const localDeclRe = /^\s*local\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
      for(let i=0;i<lines.length;i++){
        const ln = lines[i]
        const m = ln.match(localDeclRe)
        if(m){
          const name = m[1]
          const rhs = m[2].trim()
          const isService = detectService(rhs)
          let serviceName = null
          if(isService){
            // coba ekstrak nama service: game:GetService('Name') atau "Name"
            const sm = rhs.match(/GetService\s*\(\s*['\"]([A-Za-z0-9_ ]+)['\"]\s*\)/)
            if(sm) serviceName = sm[1]
          }
          locals.push({name, rhs, isService, serviceName})
          // tandai baris ini akan dihapus (diganti)
          outLines[i] = null
        }
      }

      // 2) bangun template jika diminta
      let prefix = ''
      if(opts.includeTemplate){
        // dedupe locals by name
        const namesSeen = new Set()
        const uniq = []
        for(const l of locals){ if(!namesSeen.has(l.name)){ namesSeen.add(l.name); uniq.push(l)} }
        prefix = makeGameDataTemplate(uniq)
      }

      // 3) sisipkan assignment GameData.<name> = <rhs> untuk setiap local
      const assignLines = locals.map(l => {
        // gunakan rhs as-is; kalau rhs mengandung LocalPlayer, kita biarkan
        return `GameData.${l.name} = ${l.rhs}`
      })

      // 4) gabungkan outLines tanpa null
      const body = outLines.filter(Boolean).join('\n')

      let result = prefix + assignLines.join('\n') + '\n\n' + body

      // 5) opsional: ganti semua penggunaan variabel (word boundary) ke GameData.name
      if(opts.replaceUses){
        // untuk menghindari mengganti deklarasi/assignment yang sudah kita ubah,
        // lakukan penggantian pada seluruh teks tapi pastikan tidak mengganti 'GameData.<name>' jadi double.
        // buat pattern yang mengganti \bname\b but not when preceded by 'GameData.'
        for(const l of locals){
          const name = l.name
          const re = new RegExp('\\\b' + name + '\\b','g')
          // do replacement with function to avoid replacing GameData.name
          result = result.replace(re, (m, offset, s) => {
            // check if preceding characters form 'GameData.'
            const before = s.slice(Math.max(0, offset-9), offset)
            if(/GameData\.$/.test(before)) return m
            return 'GameData.' + m
          })
        }
        // small fix: don't change 'GameData.GameData.<x>' accidentally
        result = result.replace(/GameData\.GameData\./g, 'GameData.')
      }

      return result
    }

    refactorBtn.addEventListener('click', ()=>{
      const src = input.value
      const res = refactorLua(src, {replaceUses:document.getElementById('replaceUses').checked, includeTemplate:document.getElementById('includeTemplate').checked})
      output.value = res
    })

    copyBtn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(output.value)
        alert('Teks berhasil disalin ke clipboard')
      }catch(e){
        alert('Gagal copy: ' + e)
      }
    })

    downloadBtn.addEventListener('click', ()=>{
      const blob = new Blob([output.value], {type:'text/plain'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'refactored.lua'
      document.body.appendChild(a)
      a.click()
      a.remove()
      URL.revokeObjectURL(url)
    })
  </script>
</body>
</html>
