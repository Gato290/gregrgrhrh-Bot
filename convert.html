<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lua → GameData Refactorer (Smart)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:18px;background:#0f1724;color:#e6eef8}
    header{display:flex;align-items:center;gap:12px}
    h1{font-size:18px;margin:0}
    .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    textarea{width:100%;height:60vh;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#071127;color:inherit;font-family:monospace}
    button{padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:white;cursor:pointer}
    .controls{display:flex;gap:8px;align-items:center}
    .small{font-size:13px;color:#bcd}
    footer{margin-top:10px;color:#9fb}
    label{display:flex;gap:6px;align-items:center}
    input[type=checkbox]{transform:scale(1.1)}
  </style>
</head>
<body>
  <header>
    <h1>Lua → GameData Refactorer (Smart)</h1>
    <div class="small">Tempel script kamu lalu klik <strong>Refactor</strong></div>
  </header>

  <div class="wrap">
    <div>
      <div class="small">Input Script Lua</div>
      <textarea id="input" placeholder="Paste script di sini">-- contoh
local LocalPlayer = game.Players.LocalPlayer
local char, hrp = LocalPlayer.Character, LocalPlayer.Character:WaitForChild("HumanoidRootPart")
local function Jump()
    print("Jumped")
end
      </textarea>
    </div>

    <div>
      <div class="small">Output Refactor</div>
      <textarea id="output" readonly placeholder="Hasil refactor muncul di sini"></textarea>
    </div>
  </div>

  <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
    <div class="controls">
      <button id="refactor">Refactor</button>
      <button id="copy">Copy</button>
      <button id="download">Download</button>
    </div>

    <label class="small"><input type="checkbox" id="replaceUses" checked /> Replace penggunaan variabel</label>
    <label class="small"><input type="checkbox" id="includeTemplate" checked /> Tambahkan GameData template</label>
  </div>

  <footer>
    Smart local detector: mendeteksi `local x`, `local a,b`, `local function`.
  </footer>

  <script>
    const input = document.getElementById('input')
    const output = document.getElementById('output')

    const refactorBtn = document.getElementById('refactor')
    const copyBtn = document.getElementById('copy')
    const downloadBtn = document.getElementById('download')

    function detectService(expr){
      return /game\s*:\s*GetService\s*\(/i.test(expr)
    }

    function makeGameDataTemplate(vars){
      const lines = ["local GameData = {"]

      vars.forEach(v=>{
        if(v.isFunction){
          lines.push(`    ${v.name} = nil, -- function placeholder`)
        } else if(v.isService){
          lines.push(`    ${v.name} = game:GetService("${v.serviceName || v.name}"),`)
        } else {
          lines.push(`    ${v.name} = nil,`)
        }
      })

      lines.push("}")
      return lines.join("\n") + "\n\n"
    }

    function refactorLua(src, opts){
      const lines = src.split(/\r?\n/)
      const locals = []
      let outLines = [...lines]

      const localSingle = /^\s*local\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/
      const localMulti = /^\s*local\s+([A-Za-z_][A-Za-z0-9_,\s]+)\s*=\s*(.+)$/
      const localFunc = /^\s*local\s+function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\((.*)\)/

      for(let i=0;i<lines.length;i++){
        const ln = lines[i].trim()

        // 1) local function x(a,b)
        const mFunc = ln.match(localFunc)
        if(mFunc){
          locals.push({
            name: mFunc[1],
            isFunction: true,
            args: mFunc[2],
            rhs: null
          })
          outLines[i] = lines[i].replace("local ", "")
          continue
        }

        // 2) local a,b,c = ...
        const mMulti = lines[i].match(localMulti)
        if(mMulti && mMulti[1].includes(",")){
          const names = mMulti[1].split(",").map(x=>x.trim())
          const rhsParts = mMulti[2].split(",").map(x=>x.trim())

          names.forEach((n,k)=>{
            locals.push({
              name: n,
              rhs: rhsParts[k] || "nil",
              isFunction:false,
              isService:false
            })
          })

          outLines[i] = null
          continue
        }

        // 3) local x = expr
        const mSingle = lines[i].match(localSingle)
        if(mSingle){
          const name = mSingle[1]
          const rhs = mSingle[2].trim()
          const isService = detectService(rhs)

          let serviceName = null
          if(isService){
            const mm = rhs.match(/GetService\s*\(\s*['"](.+?)['"]\s*\)/)
            if(mm) serviceName = mm[1]
          }

          locals.push({name, rhs, isService, serviceName})
          outLines[i] = null
        }
      }

      const unique = []
      const seen = new Set()
      for(const l of locals){
        if(!seen.has(l.name)){
          seen.add(l.name)
          unique.push(l)
        }
      }

      let result = ""

      if(opts.includeTemplate){
        result += makeGameDataTemplate(unique)
      }

      unique.forEach(l=>{
        if(l.isFunction){
          result += `function GameData.${l.name}(${l.args})\n`
        } else {
          result += `GameData.${l.name} = ${l.rhs}\n`
        }
      })

      result += "\n" + outLines.filter(Boolean).join("\n")

      if(opts.replaceUses){
        unique.forEach(l=>{
          const re = new RegExp("\\b" + l.name + "\\b","g")
          result = result.replace(re, (m, offset, str)=>{
            const before = str.slice(Math.max(0, offset-9), offset)
            if(/GameData\.$/.test(before)) return m
            return "GameData." + m
          })
        })
      }

      result = result.replace(/GameData\.GameData\./g, "GameData.")

      return result
    }

    refactorBtn.addEventListener('click', ()=>{
      output.value = refactorLua(input.value, {
        replaceUses: document.getElementById('replaceUses').checked,
        includeTemplate: document.getElementById('includeTemplate').checked,
      })
    })

    copyBtn.addEventListener('click', async ()=>{
      await navigator.clipboard.writeText(output.value)
      alert("Copied!")
    })

    downloadBtn.addEventListener('click', ()=>{
      const blob = new Blob([output.value], {type:"text/plain"})
      const url = URL.createObjectURL(blob)

      const a = document.createElement("a")
      a.href = url
      a.download = "refactored.lua"
      a.click()

      URL.revokeObjectURL(url)
    })
  </script>
</body>
</html>
