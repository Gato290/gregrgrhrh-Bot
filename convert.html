<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALL Local → GameData Converter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f5;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bbb;
      font-size: 14px;
      font-family: Consolas, monospace;
      resize: vertical;
    }

    button {
      padding: 10px 24px;
      margin-top: 12px;
      background: #4a7cff;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #345ef9;
    }

    pre {
      background: #1e1e1e;
      color: #8affc1;
      padding: 18px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.4;
      font-family: Consolas, monospace;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>ALL Local → GameData Converter</h2>
    <p>
      Semua <b>local variable</b> akan diubah menjadi <code>GameData.var</code>, kecuali
      deklarasi utama <code>local GameData = {}</code>.
    </p>

    <textarea id="input" placeholder="Tempel script di sini..."></textarea>
    <button onclick="convert()">Convert</button>

    <h3>Output:</h3>
    <pre id="output"></pre>
  </div>

  <script>
    function convert() {
      let text = document.getElementById("input").value;

      // 1. Simpan string literal agar tidak ikut terganti
      const stringLiterals = [];
      text = text.replace(/(["'`])((?:\\.|(?!\1).)*)\1/g, (m) => {
        const id = "__STR" + stringLiterals.length + "__";
        stringLiterals.push(m);
        return id;
      });

      // 2. Cari SEMUA local variabel
      const locals = [];
      const localRegex = /local\s+([A-Za-z_]\w*)(\s*=?)/g;
      let match;

      while ((match = localRegex.exec(text)) !== null) {
        const varName = match[1];

        // Jangan ubah deklarasi GameData
        if (varName !== "GameData") {
          locals.push(varName);
        }
      }

      // 3. Replace semua deklarasi `local x =` → `GameData.x =`
      text = text.replace(/local\s+([A-Za-z_]\w*)\s*=\s*/g, (m, v) => {
        if (v === "GameData") return m;
        return `GameData.${v} = `;
      });

      // 4. Replace `local x` tanpa nilai → `GameData.x = nil`
      text = text.replace(/local\s+([A-Za-z_]\w*)\b(?!\s*=)/g, (m, v) => {
        if (v === "GameData") return m;
        return `GameData.${v} = nil`;
      });

      // 5. Replace pemanggilan variabel
      locals.forEach(v => {
        const varUse = new RegExp("\\b" + v + "\\b", "g");
        text = text.replace(varUse, "GameData." + v);
      });

      // Jangan double prefix
      text = text.replace(/GameData\.GameData\./g, "GameData.");

      // 6. Restore string literal
      text = text.replace(/__STR(\d+)__/g, (_, i) => stringLiterals[i]);

      document.getElementById("output").textContent = text;
    }
  </script>
</body>

</html>
