<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXA OBFUSCATOR v4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020205;
            --bg-panel: #08080e;
            --primary: #8b5cf6; /* Nexa Purple */
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #1e293b;
            --success: #10b981;
            --error: #ef4444;
            --font-code: 'JetBrains Mono', monospace;
        }

        .dark-mode {
            --bg-deep: #0a0a0f;
            --bg-panel: #1a1a2e;
            --border: #2d3748;
            --text-main: #e2e8f0;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Quantum Field Background Effect */
        .quantum-field {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #8b5cf6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #a78bfa, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #c4b5fd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #a78bfa, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #8b5cf6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #7c3aed, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.2;
            animation: quantumMove 120s linear infinite;
        }

        @keyframes quantumMove {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        .bg-glow {
            position: fixed; top: 0; left: 50%; width: 50%; height: 50%; z-index: -1;
            background: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            transform: translateX(-50%);
            animation: pulseGlow 8s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        nav {
            height: 60px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; background: rgba(8, 8, 14, 0.9);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .logo { 
            font-weight: 800; 
            letter-spacing: 0.1em; 
            font-size: 1.2rem; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.8)); }
        }

        .nav-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .app-container {
            display: grid; grid-template-columns: 280px 1fr;
            height: calc(100vh - 60px);
        }

        aside {
            background: var(--bg-panel); border-right: 1px solid var(--border);
            padding: 24px; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }

        .setting-card { 
            background: rgba(255,255,255,0.02); 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            transition: transform 0.3s, border-color 0.3s;
        }
        
        .setting-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        
        .setting-card h3 { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            margin: 0 0 12px 0; 
            letter-spacing: 0.1em; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .control { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            font-size: 0.85rem; 
            padding: 4px 0;
        }
        
        .toggle { position: relative; width: 40px; height: 20px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 3px; bottom: 3px; background-color: #cbd5e1; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--bg-deep); }

        .progress-container {
            width: 100%;
            background: rgba(255,255,255,0.05);
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .preset-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .preset-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
            color: var(--text-main);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; 
            border: none; 
            padding: 14px;
            border-radius: 8px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.3s;
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover { 
            transform: translateY(-1px); 
            filter: brightness(1.1); 
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); 
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-primary .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-workspace { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
        .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
        
        .editor-wrap { 
            display: flex; flex-direction: column; 
            background: var(--bg-panel); border: 1px solid var(--border); 
            border-radius: 12px; overflow: hidden;
            transition: border-color 0.3s;
        }

        .editor-wrap.focused {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }
        
        .editor-label { 
            padding: 10px 16px; 
            background: rgba(255,255,255,0.03); 
            font-size: 0.7rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .char-count {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        textarea {
            flex: 1; background: transparent; border: none; color: #e2e8f0;
            padding: 16px; font-family: var(--font-code); font-size: 13px; resize: none; line-height: 1.6;
            transition: background-color 0.3s;
        }

        textarea:focus {
            background: rgba(255,255,255,0.01);
        }

        .terminal {
            height: 140px; 
            background: rgba(0,0,0,0.8); 
            border-radius: 8px; 
            border: 1px solid var(--border);
            padding: 12px; 
            font-family: var(--font-code); 
            font-size: 11px; 
            overflow-y: auto; 
            color: #94a3b8;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .terminal-controls {
            display: flex;
            gap: 8px;
        }

        .terminal-controls button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .terminal-controls button:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        .log-entry { 
            margin-bottom: 4px; 
            padding: 4px 0;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.success { color: var(--success); }
        .log-entry.error { color: var(--error); }
        .log-entry.process { color: var(--primary); }
        .log-entry.info { color: var(--text-muted); }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            z-index: 1000;
            color: var(--text-main);
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            
            aside {
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 300px;
            }
            
            .editors {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="quantum-field"></div>
    <div class="bg-glow"></div>
    <nav>
        <div class="logo">NEXA OBFUSCATOR</div>
        <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">QUANTUM-BUILD 4.0</div>
        <div class="nav-controls">
            <button class="theme-toggle" id="themeToggle">DARK MODE</button>
        </div>
    </nav>

    <div class="app-container">
        <aside>
            <div class="setting-card">
                <h3>Quantum System</h3>
                <div class="control tooltip" data-tooltip="Virtual Machine protection layer">
                    <span>Bytecode VM</span>
                    <label class="toggle"><input type="checkbox" checked disabled><span class="slider"></span></label>
                </div>
                <div class="control tooltip" data-tooltip="Adds confusing variable names">
                    <span>Barcode Meta</span>
                    <label class="toggle"><input type="checkbox" id="opt-barcode" checked><span class="slider"></span></label>
                </div>
            </div>

            <div class="setting-card">
                <h3>Quantum Layers</h3>
                <div class="control tooltip" data-tooltip="Rotates character codes">
                    <span>Rotation Flow</span>
                    <label class="toggle"><input type="checkbox" id="opt-rot" checked><span class="slider"></span></label>
                </div>
                <div class="control tooltip" data-tooltip="XOR encryption layer">
                    <span>XOR Matrix</span>
                    <label class="toggle"><input type="checkbox" id="opt-xor" checked><span class="slider"></span></label>
                </div>
                <div class="control tooltip" data-tooltip="Inverts binary values">
                    <span>Inverse Binary</span>
                    <label class="toggle"><input type="checkbox" id="opt-inv" checked><span class="slider"></span></label>
                </div>
            </div>

            <div class="setting-card">
                <h3>Preset Scripts</h3>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="loadPreset('simple')">Simple Print</button>
                    <button class="preset-btn" onclick="loadPreset('loop')">Loop Example</button>
                    <button class="preset-btn" onclick="loadPreset('function')">Function Demo</button>
                    <button class="preset-btn" onclick="loadPreset('game')">Game Script</button>
                </div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <button class="btn-primary" id="buildBtn" onclick="runNexaBuild()">
                <span class="spinner" id="buildSpinner"></span>
                <span id="buildText">QUANTUM ENCRYPT</span>
            </button>
        </aside>

        <main class="main-workspace">
            <div class="editors">
                <div class="editor-wrap" id="inputEditor">
                    <div class="editor-label">SOURCE CODE 
                        <span class="char-count">Chars: <span id="charCount">0</span></span>
                    </div>
                    <textarea id="input" spellcheck="false" placeholder="-- Paste Lua script here..."></textarea>
                </div>
                <div class="editor-wrap" id="outputEditor">
                    <div class="editor-label">NEXA_PAYLOAD.LUA 
                        <span style="cursor:pointer; color: var(--primary);" onclick="copyResult()">[COPY]</span>
                        <span class="char-count">Size: <span id="outputSize">0</span> chars</span>
                    </div>
                    <textarea id="output" readonly spellcheck="false" placeholder="-- Output will be generated here..."></textarea>
                </div>
            </div>

            <div class="terminal" id="terminal">
                <div class="terminal-header">
                    <div style="display: flex; align-items: center;">
                        <span class="status-indicator"></span>
                        <span style="font-size: 0.7rem; font-weight: 600;">SYSTEM LOG</span>
                    </div>
                    <div class="terminal-controls">
                        <button onclick="clearLogs()">CLEAR</button>
                        <button onclick="exportLogs()">EXPORT</button>
                    </div>
                </div>
                <div id="logs">
                    <div class="log-entry info">NEXA Kernel online. Quantum systems engaged.</div>
                    <div class="log-entry info">Ready to obfuscate Lua scripts.</div>
                </div>
            </div>
        </main>
    </div>

<script>
    const $ = id => document.getElementById(id);
    let isDarkMode = false;
    let buildInProgress = false;

    // Theme toggle
    $('themeToggle').addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            $('themeToggle').textContent = 'LIGHT MODE';
        } else {
            document.body.classList.remove('dark-mode');
            $('themeToggle').textContent = 'DARK MODE';
        }
    });

    // Character count update
    $('input').addEventListener('input', () => {
        $('charCount').textContent = $('input').value.length;
    });

    // Editor focus effects
    $('input').addEventListener('focus', () => {
        $('inputEditor').classList.add('focused');
    });
    
    $('input').addEventListener('blur', () => {
        $('inputEditor').classList.remove('focused');
    });

    // Logging function
    const log = (message, type = 'info') => {
        const d = document.createElement('div');
        d.className = `log-entry ${type}`;
        d.innerHTML = `<span style="color: var(--text-muted);">[${new Date().toLocaleTimeString()}]</span> ${message}`;
        $('logs').appendChild(d);
        $('logs').scrollTop = $('logs').scrollHeight;
    };

    // Clear logs
    function clearLogs() {
        $('logs').innerHTML = '<div class="log-entry info">Log cleared.</div>';
    }

    // Export logs
    function exportLogs() {
        const logs = $('logs').innerText;
        const blob = new Blob([logs], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'nexa-obfuscator-log.txt';
        a.click();
        URL.revokeObjectURL(url);
        log('Logs exported to file.', 'success');
    }

    // Random name generator
    function randName(l = 14) {
        if ($('opt-barcode').checked) {
            const c = ['I', 'l', '1'];
            return "I" + Array.from({length: l}, () => c[Math.floor(Math.random() * c.length)]).join("");
        }
        return "_" + Math.random().toString(36).slice(2, 11).toUpperCase();
    }

    // Nexa watermark
    const NEXA_WATERMARK = `

⠀⠀⠘⣽⢷⣦⣌⣈⠋⡚⠿⣦⡀⠀⠀⣴⣶⡄⠀⠀⣠⡶⠚⠛⣙⣭⠠⣤⣶⣯⠆⠀⠀⠀
⠀⠀⠀⣼⣷⣀⠀⠀⠈⠀⠀⠀⢻⡇⠺⡿⠛⣿⡅⠀⢿⠀⠀⣼⠿⣫⣭⣠⣤⡶⠂⠀⠀⠀
⠀⠀⠀⠀⠉⠛⠿⣹⣾⠔⠃⠀⠈⠳⠾⠏⠀⠻⣷⡺⠋⠀⣤⣸⣷⣶⡾⠖⠀⠀⠀⠀⠀⠀

    // Layer wrapping functions
    function wrapLayer(code, type) {
        const v_run = randName();
        const v_data = randName();
        const v_tbl = randName();
        const v_it = randName();
        const v_res = randName();
        const v_load = randName();
        
        const bytes = new TextEncoder().encode(code);
        let processed = "";
        let logic = "";

        if (type === "rotation") {
            const offset = Math.floor(Math.random() * 60) + 15;
            for(let b of bytes) processed += "\\" + ((b + offset) % 256);
            logic = `table.insert(${v_tbl},string.char((${v_data}:byte(${v_it})-${offset})%256))`;
        } else if (type === "xor") {
            const key = Math.floor(Math.random() * 254) + 1;
            for(let b of bytes) processed += "\\" + (b ^ key);
            logic = `table.insert(${v_tbl},string.char(bit32.bxor(${v_data}:byte(${v_it}), ${key})))`;
        } else if (type === "inversion") {
            for(let b of bytes) processed += "\\" + (255 - b);
            logic = `table.insert(${v_tbl},string.char(255 - ${v_data}:byte(${v_it})))`;
        }

        return `local function ${v_run}() local ${v_data}="${processed}"; local ${v_tbl}={}; for ${v_it}=1,#${v_data} do ${logic} end; local ${v_res}=table.concat(${v_tbl}); local ${v_load}=(loadstring or load); if ${v_load} then local _f,_e=${v_load}(${v_res}); if _f then pcall(_f) end end end; ${v_run}();`;
    }

    // Main obfuscation function
    async function runNexaBuild() {
        if (buildInProgress) return;
        
        const source = $('input').value.trim();
        if (!source) {
            log("No source code provided. Please enter Lua script to obfuscate.", "error");
            return;
        }

        buildInProgress = true;
        const btn = $('buildBtn');
        const spinner = $('buildSpinner');
        const buildText = $('buildText');
        const progressBar = $('progressBar');
        const progressContainer = $('progressContainer');
        
        btn.disabled = true;
        spinner.style.display = 'inline-block';
        buildText.textContent = "QUANTUM PROCESSING...";
        progressContainer.style.display = 'block';
        
        $('logs').innerHTML = '';
        log("NEXA OBFUSCATOR v4.0 - Initializing quantum encryption...", "process");
        
        await new Promise(r => setTimeout(r, 500));

        try {

            progressBar.style.width = '20%';
            log("Analyzing source code quantum structure...", "process");
            
            await new Promise(r => setTimeout(r, 300));

            log("Generating Quantum Bytecode Matrix...", "process");

            // Core obfuscation logic
            const masterKey = Math.floor(Math.random() * 255);
            const bytes = new TextEncoder().encode(source);

                rollingKey = (rollingKey + 13) % 255;

            if ($('opt-xor').checked) layers.push("xor");
            if ($('opt-inv').checked) layers.push("inversion");

            log(`Applying ${layers.length} quantum encryption layers...`, "process");
            progressBar.style.width = '60%';

            // Randomize layer order
            layers.sort(() => Math.random() - 0.5);

            for(let i = 0; i < layers.length; i++) {

                log(`Applying ${layer.toUpperCase()} quantum encryption (${i+1}/${layers.length})...`, "process");
                payload = wrapLayer(payload, layer).replace(/\s+/g, ' ');
                
                // Update progress
                progressBar.style.width = `${60 + ((i+1) * 30 / layers.length)}%`;

            console.error(e);

            buildInProgress = false;
            btn.disabled = false;
            spinner.style.display = 'none';
            buildText.textContent = "QUANTUM ENCRYPT";
            
            setTimeout(() => {
                progressBar.style.width = '0%';
                progressContainer.style.display = 'none';

    function copyResult() {
        if (!$('output').value.trim()) {
            log("No output to copy. Generate payload first.", "error");
            return;
        }
        
        navigator.clipboard.writeText($('output').value).then(() => {
            log("✓ Nexa payload copied to clipboard", "success");
        }).catch(err => {
            // Fallback method
            $('output').select();
            document.execCommand('copy');
            log("✓ Nexa payload copied to clipboard (fallback)", "success");
        });
    }

    // Initialize with example
    $('input').value = presets.simple;
    $('input').dispatchEvent(new Event('input'));
    log("Welcome to Nexa Obfuscator v4.0", "info");
    log("Quantum encryption systems ready", "info");
