<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lua Code Merger</title>
  <style>
    body { font-family: Arial, sans-serif; background:#1e1e1e; color:white; padding:20px; }
    textarea { width:100%; height:200px; background:#111; color:#0f0; padding:10px; border:1px solid #444; }
    button { padding:10px 20px; margin-top:10px; border:none; background:#4caf50; color:white; cursor:pointer; font-size:16px; }
    button:hover { background:#45a049; }
    .container { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    #output { height:300px; }
  </style>
</head>
<body>
  <h1>Lua Code Auto Merger</h1>
  <p>Masukkan UI Lama dan UI Baru untuk digabung otomatis.</p>

  <div class="container">
    <div>
      <h3>UI Lama</h3>
      <textarea id="oldCode"></textarea>
    </div>
    <div>
      <h3>UI Baru</h3>
      <textarea id="newCode"></textarea>
    </div>
  </div>

  <button onclick="mergeCodes()">Gabungkan</button>

  <h3>Hasil Merge</h3>
  <textarea id="output"></textarea>

  <script>
    function mergeCodes() {
      const oldCode = document.getElementById('oldCode').value.split('\n');
      const newCode = document.getElementById('newCode').value.split('\n');

      const merged = [...new Set([...oldCode, ...newCode])];

      document.getElementById('output').value = merged.join('\n');
    }
  </script>
</body>
</html>
