<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Diff Deletion Detector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1e1e1e; color: #fff; }
    textarea { width: 100%; height: 180px; background: #2d2d2d; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 6px; }
    button { padding: 10px 20px; margin-top: 10px; background: #4a90e2; border: none; border-radius: 6px; color: white; cursor: pointer; }
    button:hover { background: #357ac8; }
    .result { margin-top: 20px; padding: 15px; background: #2b2b2b; border-radius: 6px; white-space: pre-wrap; }
    .deleted { color: #ff6b6b; }
  </style>
</head>
<body>
  <h2>Code Deletion Detector</h2>
  <p>Masukkan code lama dan code baru. Sistem akan mendeteksi baris yang terhapus pada code baru.</p>

  <h3>Code Lama:</h3>
  <textarea id="oldCode"></textarea>

  <h3>Code Baru:</h3>
  <textarea id="newCode"></textarea>

  <button onclick="checkDiff()">Cek Code Terhapus</button>

  <div class="result" id="result"></div>

  <script>
    function checkDiff() {
      const oldLines = document.getElementById("oldCode").value.split("\n");
      const newLines = document.getElementById("newCode").value.split("\n");

      const deleted = oldLines.filter(line => !newLines.includes(line));

      let output = "";
      if (deleted.length === 0) {
        output = "Tidak ada code yang dihapus.";
      } else {
        output = "Baris yang terhapus:\n" + deleted.map(l => `- <span class='deleted'>${l}</span>`).join("\n");
      }

      document.getElementById("result").innerHTML = output;

      const merged = newLines.concat(deleted);
      document.getElementById("mergedCode").value = merged.join("
");
    }
  </script>
  <h3>Code Baru + Baris Terhapus:</h3>
  <textarea id="mergedCode" readonly></textarea>

</body>
</html>
