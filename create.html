<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Lua Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

  <div class="max-w-2xl mx-auto space-y-4">
    <h1 class="text-3xl font-bold text-center">🤖 AI Lua Script Generator</h1>

    <textarea id="prompt"
      class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none"
      rows="4"
      placeholder="Tulis prompt kamu disini... contoh: script auto jump roblox"
    ></textarea>

    <button onclick="generate()"
      class="w-full py-2 rounded-xl text-lg font-semibold bg-indigo-600 hover:bg-indigo-700">
      Generate Script (AI)
    </button>

    <pre id="output"
      class="p-4 rounded-xl bg-gray-800 border border-gray-700 min-h-[200px] whitespace-pre-wrap">
-- Lua script akan muncul disini...
    </pre>

    <button onclick="copyCode()"
      class="w-full py-2 rounded-xl text-lg font-semibold bg-green-600 hover:bg-indigo-700">
      Copy Script
    </button>
  </div>

<script>
async function generate() {
  const prompt = document.getElementById("prompt").value;
  document.getElementById("output").textContent = "⏳ AI lagi mikir...";

  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer 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"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {role: "system", content: "Kamu adalah AI yang hanya menghasilkan code Lua, tanpa teks tambahan."},
          {role: "user", content: prompt}
        ]
      })
    });

    const json = await res.json();
    const luaCode = json.choices?.[0]?.message?.content || "-- Gagal generate, coba ulang!";
    document.getElementById("output").textContent = luaCode;
  } catch (err) {
    document.getElementById("output").textContent = "-- Error: " + err.message;
  }
}

function copyCode() {
  const code = document.getElementById("output").textContent;
  navigator.clipboard.writeText(code);
  alert("✅ Script berhasil di-copy!");
}
</script>

</body>
</html>
