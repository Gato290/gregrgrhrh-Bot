<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lua Script Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

  <div class="max-w-2xl mx-auto space-y-4">
    <h1 class="text-3xl font-bold text-center">💻 Lua Script Generator</h1>

    <textarea id="prompt"
      class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none"
      rows="4"
      placeholder="Tulis prompt kamu disini... contoh: buatkan script auto jump"
    ></textarea>

    <button onclick="generate()"
      class="w-full py-2 rounded-xl text-lg font-semibold bg-indigo-600 hover:bg-indigo-700">
      Generate Script
    </button>

    <pre id="output"
      class="p-4 rounded-xl bg-gray-800 border border-gray-700 min-h-[200px] whitespace-pre-wrap">
-- Hasil script Lua akan muncul disini...
    </pre>

    <button onclick="copyCode()"
      class="w-full py-2 rounded-xl text-lg font-semibold bg-green-600 hover:bg-green-700">
      Copy Script
    </button>
  </div>

<script>
function generate() {
  const text = document.getElementById("prompt").value.toLowerCase()
  let lua = "-- Script tidak diketahui, coba dengan prompt lain!"

  if (text.includes("auto jump")) {
    lua = `-- Auto Jump Script
local player = game.Players.LocalPlayer
local char = player.Character or player.CharacterAdded:Wait()
local humanoid = char:WaitForChild("Humanoid")

while true do
    humanoid.Jump = true
    task.wait(0.5)
end`
  }

  if (text.includes("auto farm")) {
    lua = `-- Auto Farm Placeholder
while true do
    print("Farming...")
    task.wait(1)
end`
  }

  document.getElementById("output").textContent = lua
}

function copyCode() {
  const code = document.getElementById("output").textContent
  navigator.clipboard.writeText(code)
  alert("✅ Script berhasil dicopy!")
}
</script>

</body>
</html>
