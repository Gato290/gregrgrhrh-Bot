<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Code Storage — Premium Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0a0a0a;
        --panel: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --gold: #d4af37;
        --gold-hover: #f1c232;
        --text: #e4e4e4;
        --red: #c0392b;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 30px;
        margin: 0;
    }

    h1, h2 {
        text-align: center;
        font-weight: 700;
        background: linear-gradient(90deg, var(--gold), var(--gold-hover));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    input, textarea {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 8px;
        font-family: monospace;
        outline: none;
        transition: 0.2s;
    }

    textarea { resize: vertical; height: 130px; }

    input:focus, textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 10px var(--gold);
    }

    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 600;
        border-radius: 8px;
        transition: 0.25s;
    }

    button.primary {
        color: black;
        background: var(--gold);
        border-color: var(--gold);
        width: 100%;
    }

    button.primary:hover {
        background: var(--gold-hover);
        box-shadow: 0 0 15px var(--gold-hover);
        transform: translateY(-2px);
    }

    button.delete {
        color: white;
        background: var(--red);
        border-color: var(--red);
        position: absolute;
        bottom: 12px;
        right: 12px;
        padding: 5px 10px;
    }

    button.delete:hover {
        background: #e74c3c;
        border-color: #e74c3c;
        box-shadow: 0 0 10px #e74c3c;
    }

    #codesList {
        margin-top: 25px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
        padding-bottom: 40px;
    }

    .codeItem {
        backdrop-filter: blur(6px);
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 20px;
        border-radius: 12px;
        border-left: 5px solid var(--gold);
        position: relative;
        white-space: pre-wrap;
        font-family: monospace;
        animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .codeTitle {
        font-size: 17px;
        font-weight: 600;
        color: var(--gold-hover);
        margin-bottom: 6px;
    }

    .codeDate { font-size: 13px; opacity: 0.6; margin-bottom: 10px; }

    .copyBtn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(212,175,55,0.12);
        border: 1px solid rgba(212,175,55,0.4);
        color: var(--gold-hover);
        padding: 6px 12px;
    }

    .copyBtn:hover {
        background: var(--gold-hover);
        color: black;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 20px; }
    ::-webkit-scrollbar-track { background: #111; }
</style>
</head>
<body>

<h1>⭐ Lua Script Premium Storage ⭐</h1>

<div id="keyCreationSection" style="max-width:400px;margin:auto;padding:25px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px)">
    <h2>CREATE ACCESS KEY</h2>
    <button class="primary" onclick="createOwnerKey()">🔑 Generate Key</button>
    <input type="text" id="generatedKey" placeholder="Key akan muncul di sini..." readonly style="margin-top:12px">
</div>

<div id="authSection" style="max-width:400px;margin:auto;margin-top:30px;padding:25px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px)">
    <h2>OWNER LOGIN</h2>
    <input type="password" id="ownerKeyInput" placeholder="Masukkan Premium Key">
    <button class="primary" onclick="loginOwner()" style="margin-top:12px">ACCESS PANEL</button>
</div>

<div id="uploadSection" style="display:none;max-width:800px;margin:auto;margin-top:30px;padding:25px;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(12px)">
    <h2>UPLOAD LUA SCRIPT</h2>
    <input type="text" id="luaTitle" placeholder="Nama Script Lua">
    <textarea id="luaCode" placeholder="Paste Lua code here..."></textarea>
    <button class="primary" onclick="saveCode()">🚀 Upload Script</button>
</div>

<div id="savedCodes">
    <h2>📜 SAVED SCRIPTS</h2>
    <div id="codesList"></div>
</div>

<script>
    const codesList = document.getElementById('codesList');
    let isOwner = false;

    let storedCodes = JSON.parse(localStorage.getItem("luaCodes") || "[]");
    renderCodes();

    function createOwnerKey() {
        const newKey = "KEY-" + Math.random().toString(36).substr(2, 10).toUpperCase();
        localStorage.setItem("ownerKey", newKey);
        document.getElementById("generatedKey").value = newKey;
        alert("✅ Key berhasil dibuat dan tersimpan di device!");
    }

    function loginOwner() {
        const savedKey = localStorage.getItem("ownerKey");
        const inputKey = document.getElementById("ownerKeyInput").value.trim();

        if(!savedKey) return alert("❌ Key belum dibuat! Generate dulu.");
        if(inputKey === savedKey) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('keyCreationSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            isOwner = true;
            alert("🔥 Premium Panel Unlocked!");
        } else {
            alert("❌ Key salah!");
        }
    }

    function saveCode() {
        if(!isOwner) return alert("❌ Only owner can upload!");
        const code = document.getElementByById('luaCode').value.trim();
        const title = document.getElementById('luaTitle').value.trim();
        if(!code || !title) return alert("❗ Title & code required!");

        const date = new Date().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
        storedCodes.push({ title, code, date });
        localStorage.setItem("luaCodes", JSON.stringify(storedCodes));
        document.getElementById('luaCode').value = "";
        document.getElementById('luaTitle').value = "";
        renderCodes();
    }

    function deleteCode(index) {
        storedCodes.splice(index, 1);
        localStorage.setItem("luaCodes", JSON.stringify(storedCodes));
        alert("🗑️ Script berhasil dihapus!");
        renderCodes();
    }

    function renderCodes() {
        codesList.innerHTML = "";
        storedCodes.slice().reverse().forEach((item, i) => {
            const originalIndex = storedCodes.length - 1 - i;
            const card = document.createElement('div');
            card.className = "codeItem";

            card.innerHTML = `
                <div class="codeTitle">✨ ${item.title}</div>
                <div class="codeDate">🕒 ${item.date}</div>
                <pre>${item.code}</pre>
                <button class="copyBtn" onclick="navigator.clipboard.writeText(\`${item.code}\`); alert('✅ Script copied!')">COPY</button>
                <button class="delete" onclick="deleteCode(${originalIndex})">DELETE</button>
            `;

            codesList.appendChild(card);
        });
    }
</script>

</body>
</html>
