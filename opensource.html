<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Code Storage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #ffcc00;
        }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #2e2e2e;
            color: #f0f0f0;
            border: 1px solid #444;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        button {
            background-color: #ffcc00;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e6b800;
        }
        #savedCodes {
            margin-top: 20px;
        }
        .codeItem {
            background-color: #2e2e2e;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #ffcc00;
            white-space: pre-wrap;
            font-family: monospace;
            position: relative;
        }
        .copyBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #444;
            border: none;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
        }
        .copyBtn:hover {
            background-color: #666;
        }
        #uploadSection {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Lua Code Storage</h1>

    <div id="authSection">
        <input type="password" id="ownerPassword" placeholder="Masukkan password owner">
        <button onclick="loginOwner()">Login sebagai Owner</button>
    </div>

    <div id="uploadSection" style="display:none;">
        <textarea id="luaCode" placeholder="Masukkan kode Lua di sini..."></textarea>
        <button onclick="saveCode()">Upload Kode</button>
    </div>

    <div id="savedCodes">
        <h2>Kode yang Disimpan:</h2>
        <div id="codesList"></div>
    </div>

    <script>
        const codesList = document.getElementById('codesList');
        const ownerPasswordCorrect = "index.html"; 
        let isOwner = false;

        function loginOwner() {
            const pass = document.getElementById('ownerPassword').value;
            if(pass === ownerPasswordCorrect) {
                isOwner = true;
                document.getElementById('uploadSection').style.display = 'block';
                alert("Login sebagai owner berhasil!");
            } else {
                alert("Password salah!");
            }
        }

        function saveCode() {
            if(!isOwner) {
                alert("Hanya owner yang bisa upload kode!");
                return;
            }

            const code = document.getElementById('luaCode').value.trim();
            if(code === "") {
                alert("Masukkan kode Lua terlebih dahulu!");
                return;
            }

            const codeDiv = document.createElement('div');
            codeDiv.className = 'codeItem';
            codeDiv.textContent = code;

            const copyBtn = document.createElement('button');
            copyBtn.textContent = "Salin";
            copyBtn.className = "copyBtn";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(code).then(() => {
                    alert("Kode disalin!");
                });
            };

            codeDiv.appendChild(copyBtn);
            codesList.appendChild(codeDiv);
            document.getElementById('luaCode').value = "";
        }

        // Fitur untuk player biasa: bisa salin tapi tidak upload
    </script>
</body>
</html>
