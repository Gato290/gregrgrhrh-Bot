<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Code Storage (GitHub Model)</title>
<style>
    body { font-family: Arial; background: #1e1e1e; color: #f0f0f0; padding: 20px; }
    h1, h2 { text-align: center; color: #ffcc00; }
    textarea { width:100%; height:150px; background:#2e2e2e; color:#f0f0f0; border:1px solid #444; padding:10px; font-family: monospace; resize:vertical; }
    button { background:#ffcc00; border:none; padding:8px 16px; cursor:pointer; font-weight:bold; margin-top:5px; }
    button:hover { background:#e6b800; }
    #codesList { margin-top:20px; }
    .codeItem { background:#2e2e2e; padding:10px; margin-bottom:10px; border-left:5px solid #ffcc00; white-space: pre-wrap; font-family: monospace; position: relative; }
    .copyBtn { position:absolute; top:10px; right:10px; background:#444; border:none; color:#fff; padding:5px 10px; cursor:pointer; }
    .copyBtn:hover { background:#666; }
</style>
</head>
<body>
<h1>Lua Code Storage</h1>

<div id="authSection">
    <input type="password" id="ownerPassword" placeholder="Masukkan password owner">
    <button onclick="loginOwner()">Login Owner</button>
</div>

<div id="uploadSection" style="display:none;">
    <textarea id="luaCode" placeholder="Masukkan kode Lua di sini..."></textarea>
    <button onclick="saveCode()">Upload Kode</button>
</div>

<div id="savedCodes">
    <h2>Kode yang Disimpan:</h2>
    <div id="codesList"></div>
</div>

<script>
    const codesList = document.getElementById('codesList');
    const ownerPasswordCorrect = "12345"; // ganti password owner
    let isOwner = false;

    // load kode dari localStorage
    let storedCodes = JSON.parse(localStorage.getItem("luaCodes") || "[]");
    renderCodes();

    function loginOwner() {
        const pass = document.getElementById('ownerPassword').value;
        if(pass === ownerPasswordCorrect) {
            isOwner = true;
            document.getElementById('uploadSection').style.display = 'block';
            alert("Login owner berhasil!");
        } else {
            alert("Password salah!");
        }
    }

    function saveCode() {
        if(!isOwner) return alert("Hanya owner yang bisa upload!");
        const code = document.getElementById('luaCode').value.trim();
        if(code === "") return alert("Masukkan kode Lua!");
        storedCodes.push(code);
        localStorage.setItem("luaCodes", JSON.stringify(storedCodes));
        document.getElementById('luaCode').value = "";
        renderCodes();
    }

    function renderCodes() {
        codesList.innerHTML = "";
        storedCodes.forEach((code, idx) => {
            const codeDiv = document.createElement('div');
            codeDiv.className = 'codeItem';
            codeDiv.textContent = code;

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copyBtn';
            copyBtn.textContent = "Salin";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(code).then(()=> alert("Kode disalin!"));
            };

            codeDiv.appendChild(copyBtn);
            codesList.appendChild(codeDiv);
        });
    }
</script>
</body>
</html>
